name: NEBULA original Release symbol audit

on:
  push:
    branches: [diag/nebula-launch-evidence]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  symbols:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Xcode
        run: python3 ci/select_xcode.py
      - name: Download existing public unsigned Release (no rebuild)
        uses: actions/download-artifact@v4
        with:
          name: nebula-native-vpn-unsigned-43436217497
          run-id: 43436217497
          github-token: ${{ github.token }}
          path: original-release
      - name: Verify provenance and inspect matching symbols
        run: python3 ci/audit_release_symbols.py original-release evidence
      - name: Upload public binary analysis only
        uses: actions/upload-artifact@v4
        with:
          name: nebula-original-release-symbols-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
