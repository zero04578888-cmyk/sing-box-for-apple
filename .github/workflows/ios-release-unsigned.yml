name: NEBULA Release unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nebula-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DISABLE_SWIFTLINT: '1'
      # Public placeholders for an isolated unsigned delivery, NOT registered user App IDs.
      BASE_PACKAGE_IDENTIFIER: io.github.zero04578888.nebula
      APP_GROUP_IDENTIFIER: group.io.github.zero04578888.nebula
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Select and record Xcode
        run: |
          set -euo pipefail
          mkdir -p build-logs dist
          python3 ci/select_xcode.py
          xcodebuild -version | tee build-logs/xcode.txt
          xcodebuild -showsdks > build-logs/sdks.txt
          git rev-parse HEAD > build-logs/commit.txt
          python3 ci/preflight.py --source-only --check-xcode
          python3 -m unittest discover -s ci -p 'test_*.py' -v

      - name: Read pinned dependency
        id: dependency
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          dep = json.loads(Path('ci/libbox.json').read_text())
          xcode = subprocess.check_output(['xcodebuild', '-version'], text=True).splitlines()[-1].replace(' ', '-')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key in ['repository', 'revision', 'goVersion', 'upstreamTag']:
                  print(f'{key}={dep[key]}', file=output)
              print(f'xcode={xcode}', file=output)
          PY

      - name: Restore verified device Libbox
        id: libbox-cache
        uses: actions/cache/restore@v4
        with:
          path: Libbox.xcframework
          key: libbox-${{ runner.os }}-${{ runner.arch }}-${{ steps.dependency.outputs.xcode }}-${{ steps.dependency.outputs.revision }}-${{ steps.dependency.outputs.goVersion }}-false-${{ hashFiles('ci/libbox.json', 'ci/build_libbox.sh') }}

      - name: Checkout official core when cache is missing
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.dependency.outputs.repository }}
          ref: ${{ steps.dependency.outputs.revision }}
          path: .ci/core
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-go@v5
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        with:
          go-version: ${{ steps.dependency.outputs.goVersion }}
          cache-dependency-path: .ci/core/go.sum

      - name: Build unmodified official Libbox
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        working-directory: .ci/core
        env:
          EXPECTED_REVISION: ${{ steps.dependency.outputs.revision }}
          EXPECTED_TAG: ${{ steps.dependency.outputs.upstreamTag }}
          LIBBOX_PLATFORMS: ios/arm64
          GOTOOLCHAIN: local
        run: bash ../../ci/build_libbox.sh

      - name: Verify required Framework
        run: |
          set -euo pipefail
          python3 ci/preflight.py --check-xcode | tee build-logs/preflight.txt
          cp ci/libbox.json build-logs/libbox-provenance.json

      - uses: actions/cache/save@v4
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        with:
          path: Libbox.xcframework
          key: ${{ steps.libbox-cache.outputs.cache-primary-key }}

      - name: Restore locked Swift packages
        id: swift-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: swift-packages-${{ runner.os }}-${{ runner.arch }}-${{ steps.dependency.outputs.xcode }}-${{ hashFiles('sing-box.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Resolve locked packages and record Release settings
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies -project sing-box.xcodeproj -scheme SFI \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -onlyUsePackageVersionsFromResolvedFile -skipPackagePluginValidation 2>&1 | tee build-logs/packages.log
          git diff --exit-code -- sing-box.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          xcodebuild -showBuildSettings -json -project sing-box.xcodeproj -configuration Release -sdk iphoneos \
            -target SFI -target Extension -target WidgetExtension -target FileProviderExtension \
            -target ShareExtension -target ActionExtension -target IntentsExtension \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -disableAutomaticPackageResolution -skipPackagePluginValidation \
            BASE_PACKAGE_IDENTIFIER="$BASE_PACKAGE_IDENTIFIER" APP_GROUP_IDENTIFIER="$APP_GROUP_IDENTIFIER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM= \
            > build-logs/release-build-settings.json

      - uses: actions/cache/save@v4
        if: steps.swift-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: ${{ steps.swift-cache.outputs.cache-primary-key }}

      - name: Archive Release without developer signing
        run: |
          set -euo pipefail
          args=(-project sing-box.xcodeproj -scheme SFI -configuration Release
            -destination 'generic/platform=iOS' -derivedDataPath build/ReleaseData
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"
            -disableAutomaticPackageResolution -skipPackagePluginValidation
            "BASE_PACKAGE_IDENTIFIER=$BASE_PACKAGE_IDENTIFIER" "APP_GROUP_IDENTIFIER=$APP_GROUP_IDENTIFIER"
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM=
            PROVISIONING_PROFILE_SPECIFIER= PROVISIONING_PROFILE=)
          set +e
          xcodebuild archive "${args[@]}" -archivePath build/NEBULA-Unsigned.xcarchive \
            -resultBundlePath build/Release-Archive.xcresult 2>&1 | tee build-logs/release-archive.log
          archive_status=${PIPESTATUS[0]}
          set -e
          echo "$archive_status" > build-logs/archive-exit-status.txt
          if [[ "$archive_status" -eq 0 ]]; then
            echo 'NEBULA_RELEASE_APP=build/NEBULA-Unsigned.xcarchive/Products/Applications/sing-box.app' >> "$GITHUB_ENV"
          else
            # Preserve the archive error; a real Release build may still yield a complete .app.
            xcodebuild build "${args[@]}" -resultBundlePath build/Release-Build.xcresult \
              2>&1 | tee build-logs/release-build-fallback.log
            echo 'NEBULA_RELEASE_APP=build/ReleaseData/Build/Products/Release-iphoneos/sing-box.app' >> "$GITHUB_ENV"
          fi

      - name: Validate all extensions and create unsigned Payload IPA
        run: |
          set -euo pipefail
          python3 ci/package_unsigned_release.py --app "$NEBULA_RELEASE_APP" \
            --build-settings build-logs/release-build-settings.json --output dist

      - name: Preserve complete uncompressed build trees as tar archives
        if: always()
        run: |
          set -euo pipefail
          for directory in build/NEBULA-Unsigned.xcarchive "${NEBULA_RELEASE_APP:-}"; do
            if [[ -d "$directory" ]]; then
              python3 -c 'import sys; sys.path.insert(0,"ci"); from pathlib import Path; from package_unsigned_release import check_public_tree; check_public_tree(Path(sys.argv[1]))' "$directory"
              name=$(basename "$directory")
              tar -czf "dist/$name.tar.gz" -C "$(dirname "$directory")" "$name"
            fi
          done

      - name: Audit public delivery files
        id: public-audit
        if: always()
        run: |
          set -euo pipefail
          cp -R docs/nebula/signing dist/signing-guides
          cp LICENSE dist/LICENSE
          python3 -c 'import sys; sys.path.insert(0,"ci"); from pathlib import Path; from package_unsigned_release import check_public_tree; check_public_tree(Path("dist")); check_public_tree(Path("build-logs"))'
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path('dist')
          paths = [p for p in sorted(root.rglob('*')) if p.is_file() and p.name != 'SHA256SUMS.txt' and 'ipa-staging' not in p.parts]
          (root/'SHA256SUMS.txt').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root)}\n' for p in paths))
          PY

      - name: Upload complete unsigned delivery
        if: always() && steps.public-audit.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: nebula-release-unsigned-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/NEBULA-Release-Unsigned.ipa
            dist/*.tar.gz
            dist/release-inventory.json
            dist/requested-entitlements/
            dist/signing-guides/
            dist/SHA256SUMS.txt
            dist/LICENSE
            build-logs/
            build/Release-Archive.xcresult
            build/Release-Build.xcresult

      - name: State validation boundary
        if: always()
        run: |
          {
            echo '## Unsigned Release delivery'
            echo 'Inspect actual job status, release-inventory.json and logs before accepting.'
            echo 'Manual Payload IPA, not a developer-signed xcodebuild export. No private keys or profiles are inputs.'
            echo 'Public placeholder identity differs from the upstream App Store identity. No device installation is performed.'
            echo 'Re-signing, provisioning, installation and physical VPN operation remain unverified.'
          } >> "$GITHUB_STEP_SUMMARY"
