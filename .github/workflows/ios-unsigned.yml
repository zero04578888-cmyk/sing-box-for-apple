name: NEBULA unsigned iOS

on:
  push:
    branches: [feat/nebula-ui]
  pull_request:
  workflow_dispatch:
    inputs:
      run_ui_tests:
        description: Build Simulator slices and run fixture UI tests on iPhone 16 Pro Max (no VPN validation)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nebula-ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 ci/preflight.py --source-only
      - run: python3 -m unittest discover -s ci -p 'test_*.py' -v

  unsigned-ios:
    needs: source-checks
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DISABLE_SWIFTLINT: '1'
      RUN_UI_TESTS: ${{ inputs.run_ui_tests || false }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Select installed Xcode 26.2 or newer
        run: |
          set -euo pipefail
          mkdir -p build-logs
          python3 ci/select_xcode.py
          xcodebuild -version | tee build-logs/xcode.txt
          xcodebuild -showsdks | tee build-logs/sdks.txt
          python3 ci/preflight.py --source-only --check-xcode

      - name: Read pinned dependency
        id: dependency
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          dep = json.loads(Path('ci/libbox.json').read_text())
          xcode = subprocess.check_output(['xcodebuild', '-version'], text=True).splitlines()[-1].replace(' ', '-')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key in ['repository', 'revision', 'goVersion', 'upstreamTag']:
                  print(f'{key}={dep[key]}', file=output)
              print(f'xcode={xcode}', file=output)
              print('platforms=' + ('ios,iossimulator' if os.environ['RUN_UI_TESTS'] == 'true' else 'ios/arm64'), file=output)
          PY

      - name: Cache pinned Libbox build
        id: libbox-cache
        uses: actions/cache/restore@v4
        with:
          path: Libbox.xcframework
          key: libbox-${{ runner.os }}-${{ runner.arch }}-${{ steps.dependency.outputs.xcode }}-${{ steps.dependency.outputs.revision }}-${{ steps.dependency.outputs.goVersion }}-${{ env.RUN_UI_TESTS }}-${{ hashFiles('ci/libbox.json', 'ci/build_libbox.sh') }}

      - name: Checkout unmodified official Libbox source
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.dependency.outputs.repository }}
          ref: ${{ steps.dependency.outputs.revision }}
          path: .ci/core
          fetch-depth: 1
          persist-credentials: false

      - name: Set up upstream Go toolchain
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.dependency.outputs.goVersion }}
          cache-dependency-path: .ci/core/go.sum

      - name: Build official Libbox without source edits
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        working-directory: .ci/core
        env:
          EXPECTED_REVISION: ${{ steps.dependency.outputs.revision }}
          EXPECTED_TAG: ${{ steps.dependency.outputs.upstreamTag }}
          LIBBOX_PLATFORMS: ${{ steps.dependency.outputs.platforms }}
          GOTOOLCHAIN: local
        run: |
          bash ../../ci/build_libbox.sh

      - name: Verify required Framework slices
        run: |
          set -euo pipefail
          args=(--check-xcode)
          if [[ "$RUN_UI_TESTS" == true ]]; then args+=(--require-simulator); fi
          python3 ci/preflight.py "${args[@]}" | tee build-logs/preflight.txt
          cp ci/libbox.json build-logs/libbox-provenance.json

      - name: Save verified Libbox before application compilation
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Libbox.xcframework
          key: ${{ steps.libbox-cache.outputs.cache-primary-key }}

      - name: Restore locked Swift packages
        id: swift-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: swift-packages-${{ runner.os }}-${{ runner.arch }}-${{ steps.dependency.outputs.xcode }}-${{ hashFiles('sing-box.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Resolve locked Swift packages
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies -project sing-box.xcodeproj -scheme SFI \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -onlyUsePackageVersionsFromResolvedFile -skipPackagePluginValidation \
            2>&1 | tee build-logs/packages.log
          git diff --exit-code -- sing-box.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Save locked Swift packages
        if: steps.swift-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: ${{ steps.swift-cache.outputs.cache-primary-key }}

      - name: Compile app and embedded extensions without signing
        run: |
          set -euo pipefail
          xcodebuild build -project sing-box.xcodeproj -scheme SFI -configuration Debug \
            -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData \
            -resultBundlePath build/Unsigned-iOS.xcresult \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -disableAutomaticPackageResolution -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM= \
            2>&1 | tee build-logs/unsigned-ios.log

      - name: Prepare iPhone 16 Pro Max Simulator
        if: env.RUN_UI_TESTS == 'true'
        timeout-minutes: 10
        run: python3 ci/select_simulator.py

      - name: Run fixture UI checks with Simulator ad-hoc signing
        if: env.RUN_UI_TESTS == 'true'
        timeout-minutes: 30
        run: |
          set -euo pipefail
          xcodebuild test -project sing-box.xcodeproj -scheme SFI -configuration Debug \
            -destination "platform=iOS Simulator,id=$NEBULA_SIMULATOR_UDID" \
            -derivedDataPath build/SimulatorData -resultBundlePath build/Nebula-UI.xcresult \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -disableAutomaticPackageResolution -skipPackagePluginValidation \
            -only-testing:SFIUITests/NebulaUITests \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 180 \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            2>&1 | tee build-logs/ui-tests.log

      - name: Prepare iPad native capture
        if: env.RUN_UI_TESTS == 'true'
        timeout-minutes: 10
        env:
          NEBULA_DEVICE_NAME: iPad Pro 13-inch (M4)
        run: |
          set -euo pipefail
          xcrun simctl shutdown "$NEBULA_SIMULATOR_UDID"
          python3 ci/select_simulator.py

      - name: Capture native iPad dashboard fixture
        if: env.RUN_UI_TESTS == 'true'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          app=build/SimulatorData/Build/Products/Debug-iphonesimulator/sing-box.app
          test -f "$app/Info.plist"
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")
          mkdir -p build/TabletScreenshots
          xcrun simctl install "$NEBULA_SIMULATOR_UDID" "$app"
          SIMCTL_CHILD_SCREENSHOT_PAGE=dashboard xcrun simctl launch --terminate-running-process \
            "$NEBULA_SIMULATOR_UDID" "$bundle_id" -FASTLANE_SNAPSHOT -AppleLanguages '(en)' -AppleLocale en_US
          # Let the native initial layout settle; the exported PNG is reviewed before acceptance.
          sleep 5
          xcrun simctl io "$NEBULA_SIMULATOR_UDID" screenshot build/TabletScreenshots/NEBULA-Tablet-Dashboard.png
          xcrun simctl list devices --json > build-logs/capture-devices.json

      - name: Record validation scope
        if: always()
        run: |
          {
            echo '## NEBULA validation scope'
            echo 'See job/step status and attached logs for the actual result.'
            echo 'Unsigned compilation and fixture UI tests do not validate a signed installation or real VPN traffic.'
            echo 'No IPA export, credentials, signing certificates, or real subscriptions are used.'
            echo 'Simulator tests use ad-hoc signing only; no Apple Developer signing identity or provisioning is validated.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Export native test summary
        if: always() && env.RUN_UI_TESTS == 'true'
        run: |
          set -euo pipefail
          if [[ -d build/Nebula-UI.xcresult ]]; then
            xcrun xcresulttool get test-results summary --path build/Nebula-UI.xcresult > build-logs/ui-summary.json
            xcrun xcresulttool get test-results tests --path build/Nebula-UI.xcresult > build-logs/ui-tests.json
          fi

      - name: Export native UI screenshot attachments
        if: always() && env.RUN_UI_TESTS == 'true'
        run: |
          set -euo pipefail
          if [[ -d build/Nebula-UI.xcresult ]]; then
            xcrun xcresulttool export attachments --path build/Nebula-UI.xcresult --output-path build/UIScreenshots
          fi

      - name: Upload diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nebula-validation-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            build-logs/
            build/Unsigned-iOS.xcresult
            build/Nebula-UI.xcresult
            build/UIScreenshots/
            build/TabletScreenshots/
