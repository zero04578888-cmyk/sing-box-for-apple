workflows:
  nebula-native-vpn-unsigned:
    name: NEBULA startup fix - unsigned Release
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      xcode: '26.2'
      vars:
        DISABLE_SWIFTLINT: '1'
        GOMAXPROCS: '4'
    # Manual builds only. No automatic paid builds, signing groups or store publishing.
    cache:
      cache_paths:
        - $CM_BUILD_DIR/.ci/cache/SourcePackages
        - $CM_BUILD_DIR/.ci/cache/go-mod
        - $CM_BUILD_DIR/.ci/cache/go-build
    scripts:
      - name: Verify dependencies, test, archive and collect unsigned evidence
        script: bash ci/codemagic_unsigned_release.sh
    artifacts:
      - codemagic-artifacts/*.ipa
      - codemagic-artifacts/*.tar.gz
      - codemagic-artifacts/*.json
      - codemagic-artifacts/*.md
      - codemagic-artifacts/SHA256SUMS.txt
      - codemagic-artifacts/build-logs/**
